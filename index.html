<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolt's Workshop</title>
<meta name="description" content="Kids learn to lead AI: brief it, check it, fix it, teach it.">
<meta name="theme-color" content="#0E1426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1426; --bg2:#151D35; --card:#1B2442; --line:rgba(255,255,255,.09);
  --ink:#F5F1EA; --soft:#9AA3BD; --coral:#FF6B4A; --mint:#3CCFB0; --saffron:#F4C95D; --violet:#8B7BFF;
  --font:"DM Sans","Segoe UI",system-ui,sans-serif; color-scheme:dark;
}
html[lang="he"]{--font:"Noto Sans Hebrew","DM Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,#24305A 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:520px;margin:0 auto;min-height:100%}
.screen{display:flex;flex-direction:column;gap:18px;padding:12px 16px 40px;min-height:100vh;animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.bar .grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 44px}
.iconbtn svg{width:20px;height:20px}
.lang{height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;overflow:hidden}
.lang button{border:0;background:none;color:var(--soft);font:600 14px var(--font);padding:0 14px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.09)}
h1{font-size:38px;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:26px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
html[lang="he"] h1,html[lang="he"] h2{letter-spacing:0}
p{margin:0}
.sub{color:var(--soft);font-size:16px}
.over{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron)}
html[lang="he"] .over{letter-spacing:0}
/* Bolt speaking */
.bolt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px}
.face{flex:0 0 52px;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#2A3560;box-shadow:0 0 0 2px rgba(139,123,255,.5)}
.face img{width:100%;height:100%;display:block;object-fit:cover}
.face.talk{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px) rotate(-3deg);box-shadow:0 0 0 4px rgba(139,123,255,.8)}}
.bolt .say{flex:1;min-width:0;font-size:18px;font-weight:500;padding-top:2px}
.hear{flex:0 0 40px;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hear svg{width:18px;height:18px}
/* buttons */
.btn{min-height:58px;border-radius:29px;border:0;font:700 18px var(--font);cursor:pointer;width:100%;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--coral),#FF8E5E);color:#fff;box-shadow:0 12px 30px -12px rgba(255,107,74,.7)}
.btn.mint{background:linear-gradient(135deg,#2FB79B,var(--mint));color:#06231D}
.btn.ghost{background:rgba(255,255,255,.05);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.mission{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s}
.mission:active{transform:scale(.98)}
.mission .ic{flex:0 0 60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px}
.mission b{display:block;font-size:18px}
.mission span{color:var(--soft);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;color:var(--ink);font-family:var(--font)}
.pill.said{background:rgba(60,207,176,.14);border-color:rgba(60,207,176,.5)}
.pill.guess{background:rgba(244,201,93,.13);border-color:rgba(244,201,93,.55)}
.pill.out{opacity:.6;text-decoration:line-through;text-decoration-thickness:1px}
.pill.rule{background:rgba(139,123,255,.16);border-color:rgba(139,123,255,.55)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--soft);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-inline-end:6px;vertical-align:middle}
/* xp */
.xp{display:flex;align-items:center;gap:12px}
.xp .lv{font-weight:700;font-size:15px;white-space:nowrap}
.xp .track{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.xp .fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--coral));border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stars{color:var(--saffron);letter-spacing:2px;font-size:20px}
.stars .off{color:rgba(255,255,255,.18)}
/* input */
.talkbox{display:flex;flex-direction:column;gap:12px;align-items:center}
.mic{width:120px;height:120px;border-radius:60px;border:0;background:radial-gradient(circle at 35% 30%,#FF9A7A,var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 20px 50px -18px rgba(255,107,74,.9);transition:transform .15s}
.mic svg{width:48px;height:48px}
.mic.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,74,.6)}50%{box-shadow:0 0 0 22px rgba(255,107,74,0)}}
.mic-label{font-size:15px;color:var(--soft);font-weight:600}
textarea{width:100%;min-height:96px;border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 18px var(--font);padding:14px 16px;resize:none;outline:none}
textarea:focus{border-color:rgba(139,123,255,.7)}
input[type=text]{width:100%;height:58px;border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:600 20px var(--font);padding:0 16px;outline:none}
.thread{display:flex;flex-direction:column;gap:10px}
.msg.kid{align-self:flex-end;max-width:88%;min-height:56px;background:linear-gradient(135deg,var(--coral),#FF8E5E);color:#fff;border-radius:24px 24px 6px 24px;padding:14px 18px;font-size:19px;font-weight:600;line-height:1.4;box-shadow:0 14px 30px -16px rgba(255,107,74,.8);transition:opacity .2s}
html[dir="rtl"] .msg.kid{border-radius:24px 24px 24px 6px}
.msg.kid.empty{background:rgba(255,255,255,.04);border:1.5px dashed var(--line);color:var(--soft);box-shadow:none;font-weight:500}
.msg.kid .interim{opacity:.65}
.msg.kid .caret{display:none;width:3px;height:1.1em;background:#fff;vertical-align:-3px;margin-inline-start:3px;border-radius:2px;animation:blink 1s steps(2) infinite}
.msg.kid.live .caret{display:inline-block}
@keyframes blink{50%{opacity:0}}
.talkbar{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.mic{position:relative}
.mic .ring{position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(255,107,74,.55);transform:scale(var(--lv,1));transition:transform .08s linear;pointer-events:none;opacity:0}
.mic.on .ring{opacity:1}
.mic.on{background:radial-gradient(circle at 35% 30%,#FFB199,#FF5A36)}
.mic.busy{opacity:.6}
.bars{display:flex;gap:5px;height:28px;align-items:center;opacity:0;transition:opacity .2s}
.bars.on{opacity:1}
.bars i{display:block;width:6px;border-radius:3px;background:var(--coral);height:6px;transition:height .08s linear}
.linkbtn{background:none;border:0;color:var(--soft);font:600 15px var(--font);cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:4px}
.again{display:none}
/* stage: one phone screen, no scrolling. The picture takes what is left. */
.screen.stage{height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:10px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.stage .bar{min-height:44px}
.stagepic{flex:1 1 auto;min-height:120px;border-radius:24px;overflow:hidden;position:relative;background:#0A0F1E;touch-action:pan-y}
.stagepic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.stagepic img.hide{opacity:0}
.stagepic .tag{position:absolute;top:10px;inset-inline-start:10px;background:rgba(14,20,38,.75);font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px}
.stagepic .stars{position:absolute;top:10px;inset-inline-end:10px;background:rgba(14,20,38,.75);padding:2px 10px;border-radius:999px;font-size:18px}
.bolt.compact{padding:10px 12px;gap:10px;border-radius:20px;align-items:center}
.bolt.compact .face{flex-basis:40px;width:40px;height:40px}
.bolt.compact .say{font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bolt.compact .hear{flex-basis:36px;width:36px;height:36px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;flex:0 0 auto}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .pill{white-space:nowrap;flex:0 0 auto;font-size:14px;padding:7px 11px}
.ask{font-size:18px;font-weight:700;text-align:center;flex:0 0 auto}
.actions{display:flex;gap:10px;flex:0 0 auto}
.actions .btn{min-height:54px;font-size:17px}
.toggle{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px;flex:0 0 auto}
.toggle button{flex:1;height:40px;border:0;border-radius:999px;background:none;color:var(--soft);font:700 15px var(--font);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tipline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);flex:0 0 auto}
.tipline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-height:700px){.bolt.compact .say{-webkit-line-clamp:2}.tipline{display:none}.actions .btn{min-height:50px}}
.stage .talkbar{margin-top:0}.stage .mic{width:92px;height:92px}.stage .mic svg{width:38px;height:38px}
/* picture */
.pic{border-radius:28px;overflow:hidden;position:relative;background:var(--bg2);aspect-ratio:1/1;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.reveal img{animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{opacity:0;filter:blur(18px);transform:scale(1.05)}to{opacity:1;filter:none;transform:none}}
.pic .tag{position:absolute;top:12px;inset-inline-start:12px;background:rgba(14,20,38,.7);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cmp{position:relative}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.6)}
.cmp .tag.r{inset-inline-start:auto;inset-inline-end:12px}
/* thinking */
.think{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:12vh;text-align:center}
.orb{width:150px;height:150px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 6px rgba(139,123,255,.25),0 0 80px rgba(139,123,255,.6);animation:orb 1.6s ease-in-out infinite}
.orb img{width:100%;height:100%;object-fit:cover}
@keyframes orb{50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(139,123,255,.12),0 0 120px rgba(255,107,74,.6)}}
.dots span{display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--soft);margin:0 4px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px);background:var(--ink)}}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:0;padding:0;background:var(--bg2);cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.rulecard{display:flex;align-items:center;gap:10px;background:rgba(139,123,255,.12);border:1px solid rgba(139,123,255,.4);border-radius:18px;padding:12px 14px;font-weight:600}
.rulecard span{flex:1}
.rulecard button{border:0;background:none;color:var(--soft);font-size:22px;cursor:pointer;width:36px;height:36px}
.kidchip{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px;color:var(--ink);font:600 18px var(--font);cursor:pointer;text-align:start}
.kidchip .av{width:42px;height:42px;border-radius:21px;background:linear-gradient(135deg,var(--violet),var(--coral));display:flex;align-items:center;justify-content:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:999px;z-index:9;animation:enter .3s both;max-width:90vw;text-align:center}
.badge{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(244,201,93,.18),rgba(255,107,74,.14));border:1px solid rgba(244,201,93,.5);border-radius:20px;padding:12px 14px;font-weight:700}
.badge .b{font-size:28px}
.hero{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/3;background:var(--bg2)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(to bottom,rgba(14,20,38,0),var(--bg))}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
.offline{background:rgba(255,107,74,.14);border:1px solid rgba(255,107,74,.5);border-radius:16px;padding:12px 14px;font-size:15px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 0 calc(25% - 8px);min-width:56px;height:56px;border-radius:18px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:700 20px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--coral);background:rgba(255,107,74,.16)}
.small{font-size:14px;color:var(--soft)}
.ver{font-size:12px;color:var(--soft);text-align:center;opacity:.6}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
</style>
</head>
<body>
<div id="app"></div>
<audio id="voice" playsinline preload="auto"></audio>
<script>
var VERSION="24";
/* ---------- words ---------- */
// he: string, or [girl, boy] when it changes with the child's gender. Bolt herself is always female.
var W={
 title:{en:"Bolt's Workshop",he:"הסדנה של בולט"},
 tagline:{en:"Learn to lead AI. You're the boss.",he:["לומדים להוביל בינה מלאכותית. את הבוסית.","לומדים להוביל בינה מלאכותית. אתה הבוס."]},
 taglineN:{en:"Learn to lead AI. You're the boss.",he:"לומדים להוביל בינה מלאכותית. מי שמחליט זה את או אתה."},
 who:{en:"Who's playing?",he:"מי משחק?"},
 newKid:{en:"New player",he:"שחקן או שחקנית חדשים"},
 yourName:{en:"What's your name?",he:"איך קוראים לך?"},
 next:{en:"Next",he:"הבא"},
 girlboy:{en:"Are you a girl or a boy?",he:"את בת או אתה בן?"},
 girl:{en:"Girl",he:"בת"}, boy:{en:"Boy",he:"בן"},
 howOld:{en:"How old are you?",he:["בת כמה את?","בן כמה אתה?"]},
 intro:{en:"Hi {n}! I'm Bolt. I'm a computer program that makes pictures. I'm fast, but when you don't tell me something, I guess. You're the boss: tell me, check me, fix me.",
        he:["היי {n}! אני בולט. אני תוכנת מחשב שמציירת תמונות. אני מהירה, אבל כשלא אומרים לי משהו, אני מנחשת. את הבוסית: תגידי לי, תבדקי אותי ותתקני אותי.","היי {n}! אני בולט. אני תוכנת מחשב שמציירת תמונות. אני מהירה, אבל כשלא אומרים לי משהו, אני מנחשת. אתה הבוס: תגיד לי, תבדוק אותי ותתקן אותי."]},
 welcome:{en:"Welcome back, {n}! What should we make today?",he:["ברוכה השבה, {n}! מה נכין היום?","ברוך השב, {n}! מה נכין היום?"]},
 m_sneaker:{en:"Design a sneaker",he:"לעצב נעל ספורט"}, m_sneaker_s:{en:"Your own drop",he:"הקולקציה שלך"},
 m_album:{en:"Make an album cover",he:"לעצב עטיפת אלבום"}, m_album_s:{en:"For a band you invent",he:"ללהקה שהמצאת"},
 m_gamechar:{en:"Create a game character",he:"ליצור דמות למשחק"}, m_gamechar_s:{en:"Look, gear, vibe",he:"מראה, ציוד, אווירה"},
 m_scene:{en:"Direct a movie scene",he:"לביים סצנה מסרט"}, m_scene_s:{en:"One frame, your shot",he:"פריים אחד, הצילום שלך"},
 ask_sneaker:{en:"Describe your sneaker. Colors, materials, shape, and what makes it different.",he:["תארי את הנעל. צבעים, חומרים, צורה, ומה מייחד אותה.","תאר את הנעל. צבעים, חומרים, צורה, ומה מייחד אותה."]},
 ask_album:{en:"What's the band and the vibe? Describe the cover image, the colors and the mood.",he:["מה הלהקה ומה האווירה? תארי את התמונה, הצבעים והמצב רוח.","מה הלהקה ומה האווירה? תאר את התמונה, הצבעים והמצב רוח."]},

 return got.then(function(url){if(my!==speakSeq)return;return new Promise(function(res){AUD.onended=AUD.onerror=function(){talking(false);res()};AUD.src=url;var p=AUD.play();if(p&&p.catch)p.catch(function(){talking(false);res()})})})

var REC=null,SDKP=null,TOKEN=null;
function canRecord(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)}

function loadSDK(){if(window.SpeechSDK)return Promise.resolve(window.SpeechSDK);if(SDKP)return SDKP;SDKP=new Promise(function(res,rej){var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js";sc.onload=function(){window.SpeechSDK?res(window.SpeechSDK):rej()};sc.onerror=function(){SDKP=null;rej()};document.head.appendChild(sc)});return SDKP}
function getToken(){if(TOKEN&&Date.now()-TOKEN.at<8*60000)return Promise.resolve(TOKEN);return api("/api/listen-token",{}).then(function(j){TOKEN={token:j.token,region:j.region,at:Date.now()};return TOKEN})}
function warmListen(){if(!S.api||!canRecord())return;loadSDK().catch(function(){});getToken().catch(function(){})}
// Sound level -> ring and bars, so the child can see Bolt is hearing her.
function meter(stream,ui){try{var C=window.AudioContext||window.webkitAudioContext,ctx=new C(),src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=512;src.connect(an);var buf=new Uint8Array(an.fftSize),run=true,bars=ui.bars?ui.bars.querySelectorAll("i"):[];
 (function tick(){if(!run)return;an.getByteTimeDomainData(buf);var sum=0;for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128;sum+=v*v}var rms=Math.min(1,Math.sqrt(sum/buf.length)*4);ui.ring&&ui.ring.style.setProperty("--lv",(1+rms*.45).toFixed(3));for(var j=0;j<bars.length;j++)bars[j].style.height=(6+rms*22*(0.6+0.4*Math.sin(Date.now()/90+j*1.7)))+"px";requestAnimationFrame(tick)})();
 return function(){run=false;try{ctx.close()}catch(e){}}}catch(e){return function(){}}}
// One tap starts, one tap finishes. Words appear live in the child's bubble.
function listen(ui,onDone){
 if(REC){REC.stop();return}
 stopVoice();
 if(!canRecord()||!S.api)return listenDevice(ui,onDone);
 var base=ui.get();
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:true,channelCount:1}}).then(function(stream){
  var stopMeter=meter(stream,ui),finished=false;
  // A full recording runs alongside the live words. When she finishes, a second, stronger listener
  // re-reads the whole sentence and its version replaces the live guess.
  var mime=window.MediaRecorder?(["audio/webm;codecs=opus","audio/webm","audio/mp4"].filter(function(m){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)})[0]||""):null,parts=[],mrec=null;
  if(mime!==null){try{mrec=new MediaRecorder(stream,mime?{mimeType:mime}:{});mrec.ondataavailable=function(e){if(e.data&&e.data.size)parts.push(e.data)};mrec.start()}catch(e){mrec=null}}
  function recording(){return new Promise(function(res){if(!mrec||mrec.state==="inactive")return res(null);mrec.onstop=function(){res(new Blob(parts,{type:mrec.mimeType||mime||"audio/webm"}))};try{mrec.stop()}catch(e){res(null)}})}
  function cleanup(){stopMeter();stream.getTracks().forEach(function(tr){tr.stop()});REC=null;ui.state("idle")}
  function finish(liveText){
   ui.state("busy");
   recording().then(function(blob){
    if(!blob||blob.size<1500)return null;
    return blobToData(blob).then(function(d){return api("/api/hear",{audio:d.split(",")[1],lang:S.lang,prompt:($("#say")&&$("#say").textContent)||""})}).then(function(r){return (r&&r.text||"").trim()}).catch(function(){return null});
   }).then(function(better){
    var live=(liveText||"").trim();
    var pick=better&&(!live||better.length>=live.length*0.5)?better:live;
    stream.getTracks().forEach(function(tr){tr.stop()});stopMeter();REC=null;ui.state("idle");
    ui.set((base?base+" ":"")+pick,"");
    if(!pick)toast(t("notHeard"));
    onDone&&onDone(ui.get());
   });
  }
  ui.state("live");
  Promise.all([loadSDK(),getToken()]).then(function(x){
   var SDK=x[0],tk=x[1],cfg=SDK.SpeechConfig.fromAuthorizationToken(tk.token,tk.region);cfg.speechRecognitionLanguage=S.lang==="he"?"he-IL":"en-US";
   var rec=new SDK.SpeechRecognizer(cfg,SDK.AudioConfig.fromStreamInput(stream)),finals=[],silence=null,lastInterim="";
   function show(interim){lastInterim=interim||"";ui.set((base?base+" ":"")+finals.join(" "),interim)}
   function arm(){clearTimeout(silence);silence=setTimeout(function(){REC&&REC.stop()},finals.length?4000:9000)}
   rec.recognizing=function(_,e){show(e.result.text);arm()};
   rec.recognized=function(_,e){if(e.result.reason===SDK.ResultReason.RecognizedSpeech&&e.result.text){finals.push(e.result.text);show("")}arm()};
   rec.canceled=function(){REC&&REC.stop()};
   REC={stop:function(){if(finished)return;finished=true;clearTimeout(silence);var live=(finals.join(" ")+" "+lastInterim).trim();ui.set(base,"");try{rec.stopContinuousRecognitionAsync(function(){try{rec.close()}catch(e){}},function(){})}catch(e){}finish(live)}};
   rec.startContinuousRecognitionAsync(function(){arm()},function(){REC={stop:function(){if(finished)return;finished=true;finish("")}};});
  }).catch(function(){
   // Live words unavailable: keep recording, the stronger listener still transcribes at the end.
   REC={stop:function(){if(finished)return;finished=true;finish("")}};
   setTimeout(function(){REC&&REC.stop()},30000);
  });
 }).catch(function(){toast(t("micBlocked"));listenDevice(ui,onDone)});
}
function listenDevice(ui,onDone){
 var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast(t("micBlocked"));return}
 var r=new R(),base=ui.get();r.lang=S.lang==="he"?"he-IL":"en-US";r.interimResults=true;r.continuous=false;
 REC={stop:function(){try{r.stop()}catch(e){}}};ui.state("live");
 r.onresult=function(e){var last=e.results[e.results.length-1];if(last.isFinal)ui.set((base?base+" ":"")+last[0].transcript.trim(),"");else ui.set(base,last[0].transcript)};
 r.onerror=function(e){if(e&&/not-allowed|service-not-allowed|network/.test(e.error))toast(t("micBlocked"))};
 r.onend=function(){REC=null;ui.state("idle");onDone&&onDone(ui.get())};
 try{r.start()}catch(e){REC=null;ui.state("idle");toast(t("micBlocked"))}
}

  '<div class="toggle"><button id="tb" aria-pressed="false">'+esc(t("before"))+'</button><button id="ta" aria-pressed="true">'+esc(t("after"))+'</button></div>'+
  boltMini(b.bolt)+chipRow(b)+'<div class="ask">'+esc(t("which"))+'</div><div class="actions"><button class="btn ghost" id="pa">'+esc(t("pickBefore"))+'</button><button class="btn mint" id="pb">'+esc(t("pickAfter"))+'</button></div>'+
  (S.v.length<4?'<button class="linkbtn" id="more" style="flex:0 0 auto">'+esc(t("fixAgain"))+'</button>':''),function(){
  var showingAfter=true;

function confetti(){var c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);var x=c.getContext("2d"),P=[],cols=["#FF6B4A","#3CCFB0","#F4C95D","#8B7BFF","#fff"];for(var i=0;i<140;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[i%5],a:Math.random()*6});var f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<180)requestAnimationFrame(tick);else c.remove()})()}
