name: Bolt Test Lab
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Persona ids, comma separated (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: lab, cancel-in-progress: false }
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: worker
      - name: Virtual kids play, judge grades
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAB_ONLY: ${{ inputs.only }}
        run: node lab/run.mjs
      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/reports
          git diff --cached --quiet && exit 0
          git commit -m "Test Lab report"
          git pull --rebase -q origin main
          git push
