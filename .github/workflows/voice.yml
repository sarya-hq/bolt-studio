name: Record Bolt voice
on:
  push:
    branches: [main]
    paths: [tts/he.json, tts/en.json, tts/make_voice.py]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tts/make_voice.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Commit voice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/he-voice.json assets/en-voice.json
          git diff --cached --quiet || git commit -m "Record Bolt voice"
          git pull --rebase -q origin main
          git push
      - name: Publish the app with the new voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
