name: Deploy Bolt brain
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/api.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: api, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check keys
        env:
          RAW_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$RAW_ACC" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
          # Accept the account ID however it was pasted (bare, inside a dashboard link, with spaces).
          acc=$(printf '%s' "$RAW_ACC" | grep -oiE '[0-9a-f]{32}' | head -1)
          if [ -n "$acc" ]; then echo "::add-mask::$acc"; echo "CLOUDFLARE_ACCOUNT_ID=$acc" >> "$GITHUB_ENV"; else echo "Account ID not recognised; letting Wrangler find it from the token"; echo "CLOUDFLARE_ACCOUNT_ID=" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - name: Deploy
        run: |
          set -o pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy 2>&1 | tee deploy.log
      - name: Give the brain its keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os
          s={k:os.environ[k] for k in ["ANTHROPIC_API_KEY","AZURE_SPEECH_KEY","AZURE_SPEECH_REGION","ELEVENLABS_API_KEY"] if os.environ.get(k)}
          print("keys:",sorted(s))
          json.dump(s,open("/tmp/s.json","w"))
          PY
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler secret bulk /tmp/s.json
          rm -f /tmp/s.json
      - name: Tell the app where the brain lives
        run: |
          url=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev address in deploy output"; exit 1; }
          echo "{\"url\":\"$url\"}" > ../api.json
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.json
          if git diff --cached --quiet; then echo "address unchanged"; exit 0; fi
          git commit -m "Point the app at Bolt's brain"
          git pull --rebase -q origin main
          git push
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
