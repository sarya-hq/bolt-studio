name: Record Hebrew voice
on:
  push:
    branches: [main]
    paths: [tts/he.json, tts/make_he.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q transformers scipy uroman
      - run: python tts/make_he.py
      - name: Commit voice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/he-voice.json
          git diff --cached --quiet || git commit -m "Record Hebrew voice"
          git pull --rebase -q origin main
          git push
